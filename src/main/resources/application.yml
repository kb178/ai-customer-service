server:
  port: 8082

spring:
  application:
    name: ai-customer-service

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_customer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  # Spring AI配置 - DeepSeek
  ai:
    openai:
      base-url: https://api.xiaomimimo.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: mimo-v2.5-pro
          temperature: 0.7

# 会话配置
session:
  timeout-minutes: 30

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.aicustomer.entity
